<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    
    <body>
        
        <div id="container">
            <h1>Metric/Imperial Unit Conversion</h1>
            <div class="num-box"><input type="number" placeholder="0" id="num" ></div>
            <button id="convert">Convert</button>
        </div>
        
        <div id="container-2">
            
            <div id="group-1">
                <div class="coversion-results">
                    <h3>Length (Meter/Feet)</h3>
                    <p id="meter">0 meters = 0.000 feet | 0 feet = 0.000 meters</p>
                </div>
            </div>
            
            <div id="group-2">
                <div class="coversion-results">
                    <h3>Volume (Liters/Gallons)</h3>
                    <p id="volume">0 liters = 0 gallons | 0 gallons = 0 liters</p>
                </div>
            </div>
            
            <div id="group-3">
                <div class="coversion-results">
                    <h3>Mass (Kilograms/Pounds)</h3>
                    <p id="kilos">0 kilos = 0 pounds | 0 pounds = 0 kilos</p>
                </div>
            </div>
            
        </div>
        
        <script type="module" src="index.js"></script>
        
    </body>
</html>
